<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NC30 Pro AV Interface (Final)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="view-decoder" style="display:none; height:100%;">
                <div class="decoder-layout">
                    
                    <div class="decoder-top-grid">
                        <div class="output-container" id="outputContainer">
                            </div>
                        
                        <div class="decoder-settings-card">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                                <span class="panel-title" style="margin:0; border:none;">DECODING SETTINGS</span>
                                <button class="btn btn-primary" onclick="togglePTZ()" style="padding:4px 10px; font-size:12px;">🕹️ Open PTZ</button>
                            </div>
                            <div class="settings-scroll-area">
                                <div>
                                    <div class="settings-group-title">Layout & Routing</div>
                                    <div class="form-group">
                                        <label class="form-label">Output Mode</label>
                                        <div class="mode-selector">
                                            <div class="mode-opt active" onclick="switchOutputMode(1, this)"><span style="font-size:16px;">⬜</span> Single</div>
                                            <div class="mode-opt" onclick="switchOutputMode(4, this)"><span style="font-size:16px;">田</span> Quad</div>
                                        </div>
                                    </div>
                                    </div>
                            </div>
                            <div style="margin-top:auto; border-top:1px solid #333; padding-top:20px;">
                                <button class="btn btn-primary" style="width:100%;">Apply Changes</button>
                                <button class="btn btn-outline" style="width:100%; margin-top:10px; color:#d32f2f; border-color:#d32f2f;" onclick="clearAllWindows()">Clear All Windows</button>
                            </div>
                        </div>
                    </div>

                    <div class="source-list-panel">
                        <div class="list-toolbar">
                            <span style="font-weight:bold; font-size:14px; color:#ddd;">AVAILABLE SOURCES</span>
                            <div style="display:flex; gap:10px;">
                                <button class="btn btn-primary" onclick="showModal('Add Manual Source')">➕ Add Source</button>
                                <button class="btn btn-outline">🔄 Refresh</button>
                            </div>
                        </div>
                        
                        <div class="source-list-scroll">
                            <table class="source-list-table">
                                <thead class="source-list-header">
                                    <tr>
                                        <th style="width:50px; text-align:center;">Loop</th>
                                        <th style="width:100px;">Preview</th>
                                        <th>Source Info</th>
                                        <th style="width:120px;">Status</th>
                                        <th style="width:100px; text-align:right;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="source-row" draggable="true" ondragstart="drag(event)" data-name="Studio Cam 01" data-status="online">
                                        <td style="text-align:center;"><input type="checkbox" checked class="loop-chk"></td>
                                        <td><div class="thumb-box" style="background:#222; color:#fff;">CAM 01</div></td>
                                        <td><span class="src-name">Studio Cam 01</span><span class="src-detail">192.168.1.101</span></td>
                                        <td><div class="status-badge status-ok">● Ready</div></td>
                                        <td style="text-align:right;"><button class="btn-icon">✏️</button></td>
                                    </tr>
                                    <tr class="source-row" draggable="true" ondragstart="drag(event)" data-name="PTZ Camera 03" data-status="online">
                                        <td style="text-align:center;"><input type="checkbox" class="loop-chk"></td>
                                        <td><div class="thumb-box">PTZ 03</div></td>
                                        <td><span class="src-name">PTZ Camera 03</span><span class="src-detail">192.168.1.52</span></td>
                                        <td><div class="status-badge status-warn">▲ Warning</div></td>
                                        <td style="text-align:right;"><button class="btn-icon">✏️</button></td>
                                    </tr>
                                    <tr class="source-row" draggable="true" ondragstart="drag(event)" data-name="vMix Output" data-status="online">
                                        <td style="text-align:center;"><input type="checkbox" checked class="loop-chk"></td>
                                        <td><div class="thumb-box" style="background:#111; color:#fff;">VMIX</div></td>
                                        <td><span class="src-name">vMix Output</span><span class="src-detail">192.168.1.200</span></td>
                                        <td><div class="status-badge status-ok">● Ready</div></td>
                                        <td style="text-align:right;"><button class="btn-icon">✏️</button></td>
                                    </tr>
                                    <tr class="source-row" draggable="true" ondragstart="drag(event)" data-name="Remote Guest" data-status="offline">
                                        <td style="text-align:center;"><input type="checkbox" disabled class="loop-chk"></td>
                                        <td><div class="thumb-box" style="background:#330000; color:#ff5555; border-color:#550000;">OFFLINE</div></td>
                                        <td><span class="src-name" style="color:#aaa;">Remote Guest</span><span class="src-detail">10.0.0.5</span></td>
                                        <td><div class="status-badge" style="color:#FF3B30;">❌ Offline</div></td>
                                        <td style="text-align:right;"><button class="btn-icon">✏️</button></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

    <script>
        // ... (Login Logic, Drag Panel Logic 保持不變) ...

        // --- Drag & Drop Logic (Updated with Status & Menu) ---
        function drag(ev) { 
            ev.dataTransfer.setData("text", ev.currentTarget.getAttribute("data-name")); 
            ev.dataTransfer.setData("status", ev.currentTarget.getAttribute("data-status")); 
        }
        
        function allowDrop(ev) { ev.preventDefault(); ev.currentTarget.classList.add('drag-over'); }
        
        function drop(ev) {
            ev.preventDefault(); 
            ev.currentTarget.classList.remove('drag-over');
            
            var name = ev.dataTransfer.getData("text");
            var status = ev.dataTransfer.getData("status");
            var slotId = ev.currentTarget.id;
            var windowNum = slotId.split('-')[1];

            // 根據狀態渲染不同內容
            if (status === 'offline') {
                ev.currentTarget.className = 'preview-slot offline-state'; // 加入 offline 樣式
                ev.currentTarget.innerHTML = getOfflineSlotHTML(windowNum, name, slotId);
            } else {
                ev.currentTarget.className = 'preview-slot active-slot'; // 加入 active 樣式
                ev.currentTarget.innerHTML = getActiveSlotHTML(windowNum, name, slotId);
            }
            
            // 拖入後自動選取該格
            selectSlot(slotId);
        }

        // --- HTML Generators for Slots ---
        
        // 1. 正常連線的 Slot HTML
        function getActiveSlotHTML(num, name, id) {
            return `
                <div class="slot-label">Window ${num}</div>
                <div class="slot-menu-container">
                    <button class="slot-menu-btn" onclick="toggleSlotMenu('${id}', event)">•••</button>
                    <div class="slot-dropdown" id="menu-${id}">
                        <div class="slot-dropdown-item" onclick="alert('Edit Source: ${name}')">Edit Source</div>
                        <div class="slot-dropdown-item danger" onclick="removeSource('${id}')">Remove Source</div>
                    </div>
                </div>
                <div class="slot-content">
                    <div class="slot-name" style="color:#4CAF50;">${name}</div>
                    <div class="slot-meta">Connected</div>
                </div>
            `;
        }

        // 2. 離線的 Slot HTML (彩條)
        function getOfflineSlotHTML(num, name, id) {
            return `
                <div class="slot-label">Window ${num}</div>
                <div class="slot-menu-container">
                    <button class="slot-menu-btn" onclick="toggleSlotMenu('${id}', event)">•••</button>
                    <div class="slot-dropdown" id="menu-${id}">
                        <div class="slot-dropdown-item" onclick="alert('Check Settings')">Diagnose</div>
                        <div class="slot-dropdown-item danger" onclick="removeSource('${id}')">Remove Source</div>
                    </div>
                </div>
                <div class="offline-overlay">
                    <div class="offline-icon">⚠️</div>
                    <div class="offline-text">NO SIGNAL</div>
                    <div class="offline-source-name">${name}</div>
                </div>
            `;
        }

        // 3. 空 Slot HTML
        function getEmptySlotHTML(num, id) {
            return `
                <div class="slot-label">Window ${num}</div>
                <div class="slot-content">
                    <div class="slot-name" style="color:#555;">[ Drag Source Here ]</div>
                </div>
            `;
        }

        // --- Slot Menu Actions ---
        function toggleSlotMenu(slotId, event) {
            event.stopPropagation(); // 防止觸發選取
            // 關閉其他已開啟的選單
            document.querySelectorAll('.slot-dropdown').forEach(el => {
                if(el.id !== `menu-${slotId}`) el.classList.remove('show');
            });
            const menu = document.getElementById(`menu-${slotId}`);
            if(menu) menu.classList.toggle('show');
        }

        function removeSource(slotId) {
            // 還原為空格子
            const slot = document.getElementById(slotId);
            const num = slotId.split('-')[1];
            slot.className = 'preview-slot'; // 移除 active/offline class
            slot.innerHTML = getEmptySlotHTML(num, slotId);
            // 選取它
            selectSlot(slotId);
        }
        
        function clearAllWindows() {
            if(confirm("Remove all sources from output?")) {
                const slots = document.querySelectorAll('.preview-slot');
                slots.forEach(slot => {
                    const id = slot.id;
                    const num = id.split('-')[1];
                    slot.className = 'preview-slot';
                    slot.innerHTML = getEmptySlotHTML(num, id);
                });
            }
        }

        // --- Output Mode Switcher (Clean Version) ---
        function switchOutputMode(count, btn) {
            document.querySelectorAll('.mode-opt').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const layout = document.getElementById('outputLayout');
            layout.innerHTML = '';
            
            if(count === 1) {
                layout.className = 'output-layout-single';
                // 預設給一個正常訊號做為單畫面演示
                const slot = document.createElement('div');
                slot.className = 'preview-slot active-slot';
                slot.id = 'slot-1';
                slot.onclick = function(){ selectSlot('slot-1'); };
                slot.ondrop = function(e){ drop(e); };
                slot.ondragover = function(e){ allowDrop(e); };
                slot.innerHTML = getActiveSlotHTML(1, "Studio Cam 01", "slot-1");
                layout.appendChild(slot);
            } else {
                layout.className = 'output-layout-quad';
                // 產生 4 個格子 (1,2 有訊號，3,4 空白)
                layout.innerHTML += createSlotElement(1, "Studio Cam 01", "online");
                layout.innerHTML += createSlotElement(2, "PTZ Camera 03", "online");
                layout.innerHTML += createSlotElement(3, null, null); // Empty
                layout.innerHTML += createSlotElement(4, null, null); // Empty
            }
            selectSlot('slot-1');
        }

        // 輔助函式：產生包含事件綁定的 Slot 字串 (用於 switchOutputMode)
        function createSlotElement(num, name, status) {
            let inner = "";
            let classes = "preview-slot";
            if(name) {
                if(status === 'offline') {
                    classes += " offline-state";
                    inner = getOfflineSlotHTML(num, name, `slot-${num}`);
                } else {
                    classes += " active-slot";
                    inner = getActiveSlotHTML(num, name, `slot-${num}`);
                }
            } else {
                inner = getEmptySlotHTML(num, `slot-${num}`);
            }

            return `
                <div class="${classes}" 
                     id="slot-${num}"
                     onclick="selectSlot('slot-${num}')" 
                     ondrop="drop(event)" 
                     ondragover="allowDrop(event)" 
                     ondragleave="this.classList.remove('drag-over')">
                    ${inner}
                </div>
            `;
        }

        // ... (其餘 selectSlot, toggleSettings, Modal 邏輯保持不變) ...
        
        // 全域點擊關閉選單
        window.onclick = function(e) {
            if (!e.target.matches('.slot-menu-btn')) {
                document.querySelectorAll('.slot-dropdown').forEach(el => el.classList.remove('show'));
            }
            // ... (原本的 settings dropdown 關閉邏輯) ...
        }

    </script>
</body>
</html>
